# Workloads for the end-to-end tests: images with known CVEs, configuration that fails controls,
# one sidecar image in two namespaces (one report referred to from several namespaces), and a
# container that starts new processes and DNS lookups after the learning period (runtime alerts).
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    team: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: tools
  labels:
    team: tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        # an old release with known CVEs, as root, without limits: fails several controls
        - name: nginx
          image: nginx:1.21.6
          ports:
            - containerPort: 80
        - name: sidecar
          image: busybox:1.36.0
          command: ['sh', '-c', 'while true; do sleep 3600; done']
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36.0
          # calls the web service, which the network policy of the workload shows
          command:
            - sh
            - -c
            - 'while true; do wget -q -O /dev/null http://web.shop.svc.cluster.local || true; sleep 20; done'
          securityContext:
            privileged: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:6.2.6
          ports:
            - containerPort: 6379
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: shop
spec:
  schedule: '*/10 * * * *'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36.0
              command: ['sh', '-c', 'date; sleep 5']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: tools
  labels:
    app: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox
  template:
    metadata:
      labels:
        app: toolbox
    spec:
      containers:
        # the same sidecar image as in shop
        - name: sidecar
          image: busybox:1.36.0
          command: ['sh', '-c', 'while true; do sleep 3600; done']
        - name: alpine
          image: alpine:3.14.0
          command: ['sh', '-c', 'while true; do sleep 3600; done']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intruder
  namespace: tools
  labels:
    app: intruder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intruder
  template:
    metadata:
      labels:
        app: intruder
    spec:
      containers:
        # after the learning period it starts processes and resolves domains it never did while
        # learning, which the node-agent's default rules alert on
        - name: intruder
          image: busybox:1.36.0
          command:
            - sh
            - -c
            - 'sleep 300; while true; do ls /etc > /dev/null; cat /etc/passwd > /dev/null; nslookup kubescape.io || true; sleep 60; done'
