# End-to-end tests: the plugin in a real Headlamp (server mode, in Docker) against a kind cluster
# with the Kubescape operator, Prometheus and Alertmanager, driven by Playwright. The stack is
# heavy and Kubescape needs some 15 minutes to scan, so the tests run weekly and on demand.
name: End-to-end tests

on:
  workflow_dispatch:
  schedule:
    # Mondays at 03:17 UTC
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go/go.sum

      - name: Create the kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kubescape-e2e
          wait: 180s

      - run: npm ci

      - name: Install Kubescape, Prometheus and the test workloads
        run: bash e2e/setup-kind.sh

      - name: Build the plugin
        run: bash e2e/build-plugin.sh

      - name: Run Headlamp with the plugin
        run: bash e2e/headlamp.sh

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Type-check the tests
        run: npx tsc -p e2e

      - name: Wait for the scans, profiles and alerts
        run: bash e2e/wait-for-scans.sh
        env:
          TIMEOUT: '2700'

      - name: Run the end-to-end tests
        run: npm run e2e
        env:
          CI: 'true'

      - name: Collect the state of Headlamp and the cluster
        if: failure()
        run: |
          mkdir -p e2e/diagnostics
          docker logs headlamp-kubescape-e2e > e2e/diagnostics/headlamp.log 2>&1 || true
          kubectl --context kind-kubescape-e2e get pods -A -o wide > e2e/diagnostics/pods.txt 2>&1 || true
          kubectl --context kind-kubescape-e2e get events -A --sort-by=.lastTimestamp > e2e/diagnostics/events.txt 2>&1 || true
          kubectl --context kind-kubescape-e2e logs -n kubescape -l app.kubernetes.io/component=node-agent --tail=500 > e2e/diagnostics/node-agent.log 2>&1 || true
          kubectl --context kind-kubescape-e2e logs -n kubescape deploy/operator --tail=500 > e2e/diagnostics/operator.log 2>&1 || true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
