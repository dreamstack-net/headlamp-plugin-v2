# Builds the plugin and publishes it as a GitHub release of this fork, for
# scripts/install_headlamp_plugin.py. Run it from the Actions tab, or push a tag like v0.11.2-ds.1.
# Unlike pre-release.yaml it does not push to quay.io or commit back to the branch.
name: Release plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.11.2-ds.1'
        required: true
  push:
    tags:
      - 'v*-ds.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go/go.sum

      - uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.8.1'

      - run: npm ci
      - run: make download
      - run: npx @kinvolk/headlamp-plugin build .
      - run: make build

      - name: Package
        run: |
          mkdir kubescape-plugin
          cp -r dist/. kubescape-plugin/
          jq --arg v "$TAG" '.version = $v' package.json > kubescape-plugin/package.json
          tar -czf kubescape-plugin.tar.gz kubescape-plugin
          sha256sum kubescape-plugin.tar.gz > kubescape-plugin.tar.gz.sha256

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            kubescape-plugin.tar.gz
            kubescape-plugin.tar.gz.sha256
