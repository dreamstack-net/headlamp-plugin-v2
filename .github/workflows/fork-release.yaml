# Builds the plugin and publishes it as a GitHub release of this fork, for
# scripts/install_headlamp_plugin.py. Run it from the Actions tab, or push a tag like v0.11.2-ds.1.
# Unlike pre-release.yaml it does not push to quay.io or commit back to the branch. It runs the
# checks of the CI workflow first, and attests where the archive was built, which
# `gh attestation verify kubescape-plugin.tar.gz --repo <this repository>` checks.
name: Release plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.11.2-ds.1'
        required: true
  push:
    tags:
      - 'v*-ds.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # attest the build provenance
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check the tag and the branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag such as v0.11.2-ds.1"
            exit 1
          fi
          # a release is built from a tag or from the default branch, never from a feature branch
          if [[ "$GITHUB_REF_TYPE" != tag && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases are built from a tag or from $DEFAULT_BRANCH, not from $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go/go.sum

      - uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.8.1'

      - run: npm ci
      - run: make download

      # the checks of the CI workflow, so that a release is never built from code that fails them
      - run: npx @kinvolk/headlamp-plugin lint .
      - run: npx @kinvolk/headlamp-plugin format --check .
      - run: npx @kinvolk/headlamp-plugin tsc .
      - run: npx @kinvolk/headlamp-plugin test .
      - run: |
          go -C go vet ./...
          GOOS=js GOARCH=wasm go -C go vet ./...
          go -C go test ./...

      - run: npx @kinvolk/headlamp-plugin build .
      - run: make build

      - name: Package
        run: |
          mkdir kubescape-plugin
          cp -r dist/. kubescape-plugin/
          jq --arg v "$TAG" '.version = $v' package.json > kubescape-plugin/package.json
          tar -czf kubescape-plugin.tar.gz kubescape-plugin
          sha256sum kubescape-plugin.tar.gz > kubescape-plugin.tar.gz.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: kubescape-plugin.tar.gz

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            kubescape-plugin.tar.gz
            kubescape-plugin.tar.gz.sha256
